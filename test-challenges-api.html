<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Challenges API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #0099ff;
        }
        .challenges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .challenge-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .challenge-card h3 {
            margin: 0 0 10px 0;
            color: #0099ff;
        }
        .challenge-card p {
            margin: 5px 0;
            font-size: 14px;
        }
        .difficulty {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 10px;
        }
        .easy {
            background: #22863a;
            color: #85e89d;
        }
        .medium {
            background: #bf8700;
            color: #ffea7f;
        }
        .hard {
            background: #6d1f1a;
            color: #ff7b72;
        }
        .loading {
            color: #0099ff;
            font-size: 18px;
        }
        .error {
            color: #ff6b6b;
            padding: 20px;
            background: #3a2a2a;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Testing Challenges API</h1>
        <div id="status" class="loading">Loading challenges from backend...</div>
        <div id="challenges" class="challenges-grid"></div>
        <div id="error"></div>
    </div>

    <script>
        async function loadChallenges() {
            try {
                const response = await fetch('http://localhost:8001/api/v1x/coding-practice/challenges?limit=20', {
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const challenges = await response.json();
                document.getElementById('status').innerHTML = `✅ Loaded ${challenges.length} challenges`;
                
                const grid = document.getElementById('challenges');
                grid.innerHTML = challenges.map(c => `
                    <div class="challenge-card">
                        <h3>${c.title}</h3>
                        <p><strong>Category:</strong> ${c.category}</p>
                        <p><strong>Points:</strong> ${c.points}</p>
                        <p><strong>Attempts:</strong> ${c.total_attempts}</p>
                        <div class="difficulty ${c.difficulty.toLowerCase()}">${c.difficulty}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Failed to load challenges';
                document.getElementById('error').innerHTML = `<div class="error"><strong>Error:</strong> ${error.message}</div>`;
                console.error('Error loading challenges:', error);
            }
        }
        
        loadChallenges();
    </script>
</body>
</html>
