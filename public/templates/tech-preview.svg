<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Header with tech accent -->
  <rect x="40" y="60" width="400" height="24" fill="#111827" rx="4"/>
  <rect x="40" y="90" width="180" height="12" fill="#2563EB" rx="3"/>
  
  <!-- Colored square accent -->
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="520" y="60" width="40" height="40" fill="url(#techGrad)" rx="4"/>
  
  <!-- Contact icons -->
  <circle cx="50" cy="120" r="10" fill="#E5E7EB"/>
  <rect x="65" y="115" width="140" height="10" fill="#6B7280" rx="3"/>
  <circle cx="220" cy="120" r="10" fill="#111827"/>
  <rect x="235" y="115" width="100" height="10" fill="#6B7280" rx="3"/>
  
  <!-- Summary box with code styling -->
  <rect x="40" y="160" width="520" height="80" fill="#F9FAFB" stroke="#3B82F6" stroke-width="3" rx="4"/>
  <rect x="50" y="170" width="120" height="8" fill="#9CA3AF" rx="2"/>
  <rect x="50" y="185" width="480" height="6" fill="#6B7280" rx="2"/>
  <rect x="50" y="195" width="460" height="6" fill="#6B7280" rx="2"/>
  <rect x="50" y="205" width="440" height="6" fill="#6B7280" rx="2"/>
  
  <!-- Tech stack badges -->
  <rect x="40" y="270" width="520" height="12" fill="#111827" rx="2"/>
  <rect x="45" y="268" width="8" height="16" fill="#3B82F6"/>
  
  <defs>
    <linearGradient id="badge1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F3FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="40" y="295" width="80" height="24" fill="url(#badge1)" stroke="#3B82F6" stroke-width="1" rx="3"/>
  <rect x="130" y="295" width="70" height="24" fill="url(#badge1)" stroke="#3B82F6" stroke-width="1" rx="3"/>
  <rect x="210" y="295" width="90" height="24" fill="url(#badge1)" stroke="#3B82F6" stroke-width="1" rx="3"/>
  <rect x="310" y="295" width="75" height="24" fill="url(#badge1)" stroke="#3B82F6" stroke-width="1" rx="3"/>
  
  <!-- Featured projects box -->
  <rect x="40" y="350" width="520" height="12" fill="#111827" rx="2"/>
  <rect x="45" y="348" width="8" height="16" fill="#3B82F6"/>
  
  <rect x="40" y="375" width="520" height="100" fill="#ffffff" stroke="#E5E7EB" stroke-width="2" rx="6"/>
  <rect x="50" y="385" width="200" height="12" fill="#111827" rx="3"/>
  <rect x="470" y="385" width="50" height="20" fill="#111827" rx="3"/>
  <rect x="525" y="385" width="30" height="20" fill="#3B82F6" rx="3"/>
  <rect x="50" y="405" width="480" height="6" fill="#6B7280" rx="2"/>
  <rect x="50" y="415" width="460" height="6" fill="#6B7280" rx="2"/>
  
  <rect x="50" y="435" width="60" height="16" fill="#F3F4F6" rx="3"/>
  <rect x="115" y="435" width="50" height="16" fill="#F3F4F6" rx="3"/>
  <rect x="170" y="435" width="70" height="16" fill="#F3F4F6" rx="3"/>
  
  <!-- Footer note -->
  <text x="40" y="760" fill="#9CA3AF" font-size="11" font-family="'Inter', system-ui, sans-serif">Tech template • Developer-focused with GitHub and portfolio emphasis</text>
</svg>
