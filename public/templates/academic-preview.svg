<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Header - Traditional centered academic -->
  <rect x="200" y="60" width="200" height="20" fill="#111827" rx="3"/>
  <rect x="40" y="120" width="520" height="2" fill="#1F2937"/>
  
  <!-- Contact info - Centered -->
  <rect x="220" y="95" width="160" height="6" fill="#6B7280" rx="2"/>
  <rect x="240" y="105" width="120" height="6" fill="#6B7280" rx="2"/>
  
  <!-- Research Interests -->
  <rect x="40" y="150" width="220" height="12" fill="#111827" rx="2"/>
  <rect x="40" y="170" width="520" height="6" fill="#6B7280" rx="2"/>
  <rect x="40" y="180" width="500" height="6" fill="#6B7280" rx="2"/>
  <rect x="40" y="190" width="480" height="6" fill="#6B7280" rx="2"/>
  
  <!-- Education - Most prominent -->
  <rect x="40" y="220" width="140" height="12" fill="#111827" rx="2"/>
  
  <rect x="40" y="245" width="260" height="12" fill="#111827" rx="3"/>
  <rect x="440" y="245" width="120" height="8" fill="#6B7280" rx="2" font-style="italic"/>
  <rect x="40" y="265" width="300" height="8" fill="#6B7280" rx="2" font-style="italic"/>
  <rect x="40" y="280" width="100" height="6" fill="#9CA3AF" rx="2"/>
  <rect x="40" y="295" width="480" height="6" fill="#9CA3AF" rx="2" font-style="italic"/>
  
  <rect x="40" y="320" width="260" height="12" fill="#111827" rx="3"/>
  <rect x="440" y="320" width="120" height="8" fill="#6B7280" rx="2"/>
  <rect x="40" y="340" width="300" height="8" fill="#6B7280" rx="2"/>
  
  <!-- Academic Appointments -->
  <rect x="40" y="380" width="280" height="12" fill="#111827" rx="2"/>
  
  <rect x="40" y="405" width="240" height="10" fill="#111827" rx="2"/>
  <rect x="440" y="405" width="120" height="8" fill="#6B7280" rx="2" font-style="italic"/>
  <rect x="40" y="422" width="200" height="8" fill="#6B7280" rx="2"/>
  <rect x="40" y="437" width="460" height="6" fill="#9CA3AF" rx="2" font-style="italic"/>
  <rect x="40" y="450" width="480" height="6" fill="#6B7280" rx="2"/>
  <rect x="40" y="460" width="460" height="6" fill="#6B7280" rx="2"/>
  
  <!-- Publications -->
  <rect x="40" y="500" width="180" height="12" fill="#111827" rx="2"/>
  
  <!-- Hanging indent style -->
  <rect x="60" y="525" width="480" height="6" fill="#6B7280" rx="2"/>
  <rect x="60" y="535" width="500" height="6" fill="#6B7280" rx="2"/>
  <rect x="60" y="550" width="480" height="6" fill="#6B7280" rx="2"/>
  <rect x="60" y="560" width="500" height="6" fill="#6B7280" rx="2"/>
  
  <!-- Footer note -->
  <text x="40" y="760" fill="#9CA3AF" font-size="11" font-family="'Times New Roman', serif" font-style="italic">Academic template • Traditional research-oriented layout for faculty positions</text>
</svg>
