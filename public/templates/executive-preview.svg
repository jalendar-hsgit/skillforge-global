<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Header - Centered with double border -->
  <rect x="40" y="60" width="520" height="2" fill="#1F2937"/>
  <rect x="40" y="140" width="520" height="2" fill="#1F2937"/>
  
  <!-- Name - Large centered -->
  <rect x="180" y="80" width="240" height="20" fill="#111827" rx="4"/>
  
  <!-- Contact info - Centered -->
  <rect x="220" y="110" width="160" height="8" fill="#6B7280" rx="3"/>
  
  <!-- Section header with full-width border -->
  <rect x="40" y="180" width="520" height="14" fill="#111827" rx="3"/>
  <rect x="40" y="200" width="520" height="2" fill="#1F2937"/>
  
  <!-- Core competencies grid -->
  <rect x="40" y="220" width="160" height="40" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="220" y="220" width="160" height="40" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="400" y="220" width="160" height="40" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Executive Experience section -->
  <rect x="40" y="290" width="520" height="14" fill="#111827" rx="3"/>
  <rect x="40" y="310" width="520" height="2" fill="#1F2937"/>
  
  <!-- Experience entries with bold headers -->
  <rect x="40" y="330" width="280" height="12" fill="#111827" rx="3"/>
  <rect x="440" y="330" width="120" height="8" fill="#6B7280" rx="3"/>
  <rect x="40" y="348" width="220" height="10" fill="#6B7280" rx="3"/>
  <rect x="40" y="365" width="500" height="6" fill="#D1D5DB" rx="2"/>
  <rect x="40" y="375" width="480" height="6" fill="#D1D5DB" rx="2"/>
  <rect x="40" y="385" width="460" height="6" fill="#D1D5DB" rx="2"/>
  
  <rect x="40" y="420" width="280" height="12" fill="#111827" rx="3"/>
  <rect x="440" y="420" width="120" height="8" fill="#6B7280" rx="3"/>
  <rect x="40" y="438" width="220" height="10" fill="#6B7280" rx="3"/>
  
  <!-- Footer note -->
  <text x="40" y="760" fill="#9CA3AF" font-size="11" font-family="Georgia, serif" font-style="italic">Executive template • Premium serif design for senior leadership</text>
</svg>
