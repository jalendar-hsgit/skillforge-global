# .gitlab-ci.yml - SkillForge Global CI/CD Pipeline
# Version: 2.0.0 - Vercel + Railway Deployment
# Last Updated: January 5, 2026
# Username: prasadreddy147

stages:
  - test
  - deploy

# Global variables
variables:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  NODE_ENV: "production"
  VERCEL_ORG_ID: $VERCEL_ORG_ID
  VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID
  RAILWAY_TOKEN: $RAILWAY_TOKEN
  RAILWAY_PROJECT_ID: $RAILWAY_PROJECT_ID

# Cache settings
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip/
    - .cache/npm/
    - node_modules/
    - backend/.pytest_cache/

# ============ TESTING STAGE ============

# Frontend Tests
frontend_test:
  stage: test
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run build
    - npm test --passWithNoTests 2>/dev/null || echo "No tests configured"
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 30 days
  cache:
    paths:
      - node_modules/
  only:
    - merge_requests
    - main
    - v1.0.0-release
    - develop

# Backend Tests
backend_test:
  stage: test
  image: python:3.11-slim
  services:
    - postgres:15
  variables:
    POSTGRES_DB: skillforge_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    DATABASE_URL: postgresql://test_user:test_pass@postgres:5432/skillforge_test
  before_script:
    - pip install --upgrade pip
    - cd backend
    - pip install -r requirements.txt
  script:
    - pytest tests/ --cov=app 2>/dev/null || echo "No tests configured"
  artifacts:
    when: always
    paths:
      - backend/coverage/
    expire_in: 30 days
  cache:
    paths:
      - backend/.venv/
  only:
    - merge_requests
    - main
    - v1.0.0-release
    - develop

# ============ DEPLOYMENT STAGE ============

# Deploy Frontend to Vercel
deploy_vercel:
  stage: deploy
  image: node:20-alpine
  before_script:
    - npm install -g vercel@latest
  script:
    - echo "🚀 Deploying frontend to Vercel (user: prasadreddy147)..."
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ] || [ "$CI_COMMIT_BRANCH" == "v1.0.0-release" ]; then
        echo "📦 Production deployment..."
        vercel --prod --token=$VERCEL_TOKEN
      else
        echo "🔄 Preview deployment..."
        vercel --token=$VERCEL_TOKEN
      fi
    - echo "✅ Vercel deployment complete"
  environment:
    name: production/vercel
    url: https://prasadreddy147.vercel.app
  only:
    - main
    - v1.0.0-release
  when: on_success

# Deploy Backend to Railway
deploy_railway:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl wget unzip
    - wget -q https://releases.railway.app/railway_linux_amd64.zip
    - unzip -q railway_linux_amd64.zip -d /usr/local/bin
  script:
    - echo "🚀 Deploying backend to Railway (user: prasadreddy147)..."
    - |
      if [ -z "$RAILWAY_TOKEN" ]; then
        echo "❌ ERROR: RAILWAY_TOKEN not configured"
        echo "ℹ️  Add RAILWAY_TOKEN to GitLab CI/CD Variables"
        exit 1
      fi
    - export RAILWAY_TOKEN=$RAILWAY_TOKEN
    - cd backend
    - echo "📦 Deploying to Railway..."
    - railway up --detach || railway up
    - echo "✅ Railway deployment complete"
  environment:
    name: production/railway
    url: https://prasadreddy147-backend.up.railway.app
  only:
    - main
    - v1.0.0-release
  when: on_success

# Health Check
health_check:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "🔍 Checking deployment health..."
    - sleep 30
    - echo "Checking frontend at: https://prasadreddy147.vercel.app"
    - curl -s -f https://prasadreddy147.vercel.app > /dev/null && echo "✅ Frontend is up" || echo "⚠️  Frontend check pending"
    - echo ""
    - echo "Checking backend at: https://prasadreddy147-backend.up.railway.app/health"
    - curl -s -f https://prasadreddy147-backend.up.railway.app/health > /dev/null && echo "✅ Backend is up" || echo "⚠️  Backend check pending"
  only:
    - main
    - v1.0.0-release
  when: on_success
  allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push"'
