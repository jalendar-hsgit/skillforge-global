name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8001
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: sqlite:///./backend/app/data/ci.db
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          for i in {1..40}; do
            curl -sf http://127.0.0.1:8001/healthz && break || true
            sleep 0.5
          done
        working-directory: backend

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p .

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Next.js
        run: |
          PORT=3000 npm run start &
          for i in {1..40}; do
            curl -sf http://127.0.0.1:3000/ && break || true
            sleep 0.5
          done

      - name: Run Playwright tests (headless)
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run unit tests (unittest)
        env:
          DATABASE_URL: sqlite:///./app/data/ci_test.db
          JWT_SECRET: ci-secret-key
          FRONTEND_ORIGIN: http://localhost:3000
          DEBUG: true
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run E2E tests (pytest)
        if: always()
        env:
          DATABASE_URL: sqlite:///./app/data/ci.db
          JWT_SECRET: ci-secret
          FRONTEND_ORIGIN: http://localhost:3000
        run: |
          python -m pytest tests_e2e -q || echo "⚠️ E2E tests not found or failed"
        continue-on-error: true
      - name: Check backend imports
        run: |
          python -c "from app.main import app; print('✅ Backend imports successfully')"

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      - name: Lint with flake8 (syntax errors only)
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  database-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test Alembic migrations
        env:
          DATABASE_URL: sqlite:///./ci_migration_test.db
        run: |
          alembic upgrade head
          alembic current
          echo "✅ Migrations applied successfully"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8001
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  deploy-conditional:
     needs: [backend-tests, backend-lint, database-migrations, frontend-build]
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN || secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Vercel (optional)
        if: ${{ secrets.VERCEL_TOKEN && secrets.VERCEL_ORG_ID && secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "vercel_preview_url=$url" >> $GITHUB_OUTPUT
      - name: Trigger Backend Deploy on Render (optional)
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID }}
        run: |
          curl -s -X POST \ 
            -H 'accept: application/json' \ 
            -H 'authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \ 
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
