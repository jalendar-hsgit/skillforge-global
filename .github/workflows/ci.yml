name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run E2E tests
        env:
          DATABASE_URL: sqlite:///./app/data/ci.db
          JWT_SECRET: ci-secret
          FRONTEND_ORIGIN: http://localhost:3000
        run: |
          python -m pytest tests_e2e -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8001
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  deploy-conditional:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN || secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Vercel (optional)
        if: ${{ secrets.VERCEL_TOKEN && secrets.VERCEL_ORG_ID && secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "vercel_preview_url=$url" >> $GITHUB_OUTPUT
      - name: Trigger Backend Deploy on Render (optional)
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID }}
        run: |
          curl -s -X POST \ 
            -H 'accept: application/json' \ 
            -H 'authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \ 
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
